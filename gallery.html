<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Screenshot Gallery</title>
</head>
<style>
  /* ===================================================
   Marshall Wilcox Portfolio — Shared Stylesheet
   =================================================== */

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  /* ─── CSS Variables ─────────────────────────────── */
  :root {
    --bg: #0a0f1e;
    --surface: #0d1424;
    --card: #111827;
    --border: #1e2d45;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.18);
    --accent-hover: #60a5fa;
    --green: #10b981;
    --purple: #8b5cf6;
    --red: #ef4444;
    --orange: #f59e0b;
    --cyan: #06b6d4;
    --nav-h: 64px;
    --radius: 16px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    --transition: 0.2s ease;
  }

  [data-theme="light"] {
    --bg: #f1f5fb;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.10);
    --accent-hover: #3b82f6;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }

  /* ─── Reset & Base ──────────────────────────────── */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 1rem;
    transition: background var(--transition), color var(--transition);
    min-height: 100vh;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    transition: color var(--transition);
  }

  a:hover {
    color: var(--accent-hover);
  }

  img {
    max-width: 100%;
    display: block;
  }

  /* ─── Navigation ────────────────────────────────── */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    background: rgba(13, 20, 36, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 2rem;
    gap: 1rem;
    transition: background var(--transition), border-color var(--transition);
  }

  [data-theme="light"] .nav {
    background: rgba(255, 255, 255, 0.85);
  }

  .nav-logo {
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    list-style: none;
    margin: 0 auto;
  }

  .nav-links a {
    color: var(--muted);
    font-size: 0.875rem;
    font-weight: 500;
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    transition: color var(--transition), background var(--transition);
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--text);
    background: var(--accent-glow);
  }

  .nav-links a.active {
    color: var(--accent);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .btn-theme {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all var(--transition);
  }

  .btn-theme:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .btn-resume {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .btn-resume:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  /* Hamburger */
  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
    margin-left: auto;
  }

  .nav-hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--muted);
    border-radius: 2px;
    transition: all var(--transition);
  }

  .nav-drawer {
    display: none;
    position: fixed;
    top: var(--nav-h);
    left: 0;
    right: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    z-index: 999;
    flex-direction: column;
    gap: 0.25rem;
  }

  .nav-drawer.open {
    display: flex;
  }

  .nav-drawer a {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    transition: all var(--transition);
  }

  .nav-drawer a:hover,
  .nav-drawer a.active {
    color: var(--accent);
    background: var(--accent-glow);
  }

  /* ─── Footer ────────────────────────────────────── */
  .footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
    margin-top: auto;
  }

  .footer a {
    color: var(--accent);
  }

  /* ─── Page Wrapper ──────────────────────────────── */
  .page {
    padding-top: var(--nav-h);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem;
    width: 100%;
  }

  .section {
    padding: 5rem 0;
  }

  .section-sm {
    padding: 3rem 0;
  }

  /* ─── Typography ────────────────────────────────── */
  .page-heading {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--text);
  }

  .page-subheading {
    font-size: 1.1rem;
    color: var(--muted);
    margin-top: 0.75rem;
    max-width: 60ch;
    line-height: 1.6;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  /* ─── Buttons ───────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.75rem 1.5rem;
    border-radius: var(--radius-sm);
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 24px rgba(59, 130, 246, 0.3);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    color: #fff;
    box-shadow: 0 0 32px rgba(59, 130, 246, 0.45);
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  /* ─── Cards ─────────────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    transition: all var(--transition);
  }

  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 32px var(--accent-glow);
    transform: translateY(-2px);
  }

  /* ─── Badges / Pills ────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.6rem;
    border-radius: 100px;
  }

  .badge-blue {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
  }

  .badge-purple {
    background: rgba(139, 92, 246, 0.15);
    color: #a78bfa;
  }

  .badge-green {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
  }

  .badge-red {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
  }

  .badge-orange {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
  }

  .badge-cyan {
    background: rgba(6, 182, 212, 0.15);
    color: #22d3ee;
  }

  .tech-pill {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.25rem 0.65rem;
    border-radius: 100px;
    background: var(--accent-glow);
    color: var(--accent);
    border: 1px solid rgba(59, 130, 246, 0.25);
    white-space: nowrap;
  }

  .pills-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.75rem;
  }

  /* ─── Stat Cards ────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.25rem;
    text-align: center;
  }

  .stat-number {
    font-size: 2.25rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.25rem;
    font-weight: 500;
  }

  /* ─── Project Cards (overview grid) ─────────────── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all var(--transition);
  }

  .project-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 32px var(--accent-glow);
    transform: translateY(-3px);
  }

  .project-card-accent {
    height: 4px;
  }

  .project-card-body {
    padding: 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .project-card-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .project-card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .project-card p {
    font-size: 0.875rem;
    color: var(--muted);
    line-height: 1.6;
    flex: 1;
  }

  .project-card-footer {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .project-link {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }

  .project-link:hover {
    color: var(--accent-hover);
  }

  /* ─── Project Detail ────────────────────────────── */
  .detail-hero {
    background: linear-gradient(135deg, var(--surface) 0%, var(--card) 100%);
    border-bottom: 1px solid var(--border);
    padding: 4rem 0 3rem;
  }

  .detail-back {
    font-size: 0.875rem;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-bottom: 1.5rem;
  }

  .detail-back:hover {
    color: var(--accent);
  }

  .detail-title {
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin: 0.75rem 0;
  }

  .detail-date {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  .detail-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2.5rem;
    align-items: start;
    padding: 3rem 0 5rem;
  }

  .detail-content h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 2rem 0 0.75rem;
    color: var(--text);
  }

  .detail-content h2:first-child {
    margin-top: 0;
  }

  .detail-content p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.75;
    margin-bottom: 0.75rem;
  }

  .detail-content ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .detail-content ul li {
    font-size: 0.925rem;
    color: var(--muted);
    line-height: 1.65;
    padding-left: 1.25rem;
    position: relative;
  }

  .detail-content ul li::before {
    content: '▸';
    color: var(--accent);
    position: absolute;
    left: 0;
    font-size: 0.75rem;
    top: 0.25rem;
  }

  .detail-content ul li strong {
    color: var(--text);
    font-weight: 600;
  }

  .detail-sidebar {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: sticky;
    top: calc(var(--nav-h) + 1.5rem);
  }

  .sidebar-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }

  .sidebar-card h4 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .fact-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }

  .fact-row:last-child {
    border-bottom: none;
  }

  .fact-label {
    color: var(--muted);
  }

  .fact-value {
    font-weight: 600;
    color: var(--text);
    text-align: right;
  }

  .impact-card {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: var(--radius);
    padding: 1.25rem;
    text-align: center;
  }

  .impact-card .impact-number {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .impact-card .impact-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  /* ─── Timeline ───────────────────────────────────── */
  .timeline {
    position: relative;
    padding: 2rem 0;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, transparent, var(--accent) 5%, var(--accent) 95%, transparent);
    transform: translateX(-50%);
  }

  .timeline-item {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    gap: 0;
    margin-bottom: 3rem;
    align-items: start;
  }

  .timeline-item:last-child {
    margin-bottom: 0;
  }

  .timeline-item.left .tl-content {
    grid-column: 1;
    text-align: right;
    padding-right: 2.5rem;
  }

  .timeline-item.left .tl-dot {
    grid-column: 2;
  }

  .timeline-item.left .tl-empty {
    grid-column: 3;
  }

  .timeline-item.right .tl-empty {
    grid-column: 1;
  }

  .timeline-item.right .tl-dot {
    grid-column: 2;
  }

  .timeline-item.right .tl-content {
    grid-column: 3;
    text-align: left;
    padding-left: 2.5rem;
  }

  .tl-dot {
    display: flex;
    justify-content: center;
    padding-top: 0.25rem;
  }

  .tl-dot-inner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent-glow);
    flex-shrink: 0;
  }

  .tl-content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    transition: all var(--transition);
  }

  .tl-content:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 24px var(--accent-glow);
  }

  .tl-date {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }

  .tl-title {
    font-size: 0.975rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 0.2rem;
  }

  .tl-company {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .tl-desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 0.75rem;
  }

  .tl-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .timeline-item.left .tl-tags {
    justify-content: flex-end;
  }

  .tl-tag {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 100px;
    background: var(--accent-glow);
    color: var(--accent);
    border: 1px solid rgba(59, 130, 246, 0.2);
  }

  /* ─── Gallery ────────────────────────────────────── */
  .gallery-grid {
    columns: 3;
    column-gap: 1.25rem;
  }

  .gallery-card {
    break-inside: avoid;
    margin-bottom: 1.25rem;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    cursor: default;
    transition: all var(--transition);
  }

  .gallery-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  .gallery-card-inner {
    padding: 2rem 1.5rem;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
  }

  .gallery-icon {
    font-size: 2rem;
    margin-bottom: 0.75rem;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
  }

  .gallery-era {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 0.3rem;
  }

  .gallery-title {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 0.4rem;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }

  .gallery-desc {
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }

  /* ─── About ──────────────────────────────────────── */
  .about-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 3rem;
    align-items: start;
  }

  .about-bio p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.8;
    margin-bottom: 1.25rem;
  }

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin: 1.75rem 0;
  }

  .contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem;
    text-align: center;
  }

  .contact-card .contact-icon {
    font-size: 1.25rem;
    margin-bottom: 0.4rem;
  }

  .contact-card .contact-label {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .contact-card .contact-value {
    font-size: 0.82rem;
    color: var(--text);
    font-weight: 500;
    margin-top: 0.2rem;
    word-break: break-all;
  }

  .edu-card,
  .cert-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    display: flex;

<script>
  const images = Array.from(document.querySelectorAll('.gallery-grid img'));
  let currentIndex = 0;

  function openModal(index) {
    currentIndex = index;

    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
    <div class="modal-content">
      <button class="nav-btn left-btn">&#10094;</button>
      <img src="${images[currentIndex].src}" class="modal-img" alt="Screenshot of a system I worked on">
      <button class="nav-btn right-btn">&#10095;</button>
    </div>
  `;

    // Close modal on background click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();
    });

    // Left button
    modal.querySelector('.left-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showPrev(modal);
    });

    // Right button
    modal.querySelector('.right-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showNext(modal);
    });

    // Keyboard navigation
    document.addEventListener('keydown', keyHandler);

    document.body.appendChild(modal);
  }

  function keyHandler(e) {
    const modal = document.querySelector('.modal');
    if (!modal) return;

    if (e.key === 'ArrowLeft') showPrev(modal);
    if (e.key === 'ArrowRight') showNext(modal);
    if (e.key === 'Escape') modal.remove();
  }

  function showPrev(modal) {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    modal.querySelector('.modal-img').src = images[currentIndex].src;
  }

  function showNext(modal) {
    currentIndex = (currentIndex + 1) % images.length;
    modal.querySelector('.modal-img').src = images[currentIndex].src;
  }

  // Attach click handlers to thumbnails
  images.forEach((img, index) => {
    img.addEventListener('click', () => openModal(index));
  });

</script>
